name: CI

on:
  push:
    branches:
    - '**'
    tags-ignore:
    - '**'
    paths-ignore:
      - '.github/*'
      - '.github/workflows/**.yml'
      - '.gitattributes'
      - '.gitignore'
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build-plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore Plugin/FEZ.HAT.mm.csproj

      - name: Build plugin
        run: dotnet build Plugin/FEZ.HAT.mm.csproj -c Debug

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: HAT
          path: Plugin/bin/Debug/
          if-no-files-found: error

  build-installer:
    needs: [ build-plugin ]
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: HATinstaller-win-x64.exe
          - os: ubuntu-latest
            rid: linux-x64
            artifact: HATinstaller-linux-x64
          - os: macos-latest
            rid: osx-x64
            artifact: HATinstaller-osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish installer
        run: dotnet publish Installer/FEZ.HAT.Installer.csproj -c Debug -r ${{ matrix.rid }} -o artifacts/installer-publish

      - name: Rename artifact
        shell: bash
        run: |
          src="artifacts/installer-publish/HATinstaller"
          if [[ "${{ runner.os }}" == "Windows" ]]; then src+=".exe"; fi
          mv "$src" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          archive: false
          if-no-files-found: error
